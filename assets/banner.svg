<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Metallic/Glow Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glowing lock gradient -->
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.6)); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(3deg); }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(100px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -40;
        }
      }
      .lock-container {
        animation: float 6s ease-in-out infinite;
        transform-origin: 250px 200px;
      }
      .pulse-glow {
        animation: pulse 4s ease-in-out infinite;
      }
      .grid-lines {
        stroke: rgba(99, 102, 241, 0.08);
        stroke-width: 1;
      }
      .particle {
        fill: #38bdf8;
        opacity: 0.6;
      }
      .orbit-particle-1 {
        animation: orbit 15s linear infinite;
        transform-origin: 250px 200px;
      }
      .moving-path {
        stroke: url(#lockGrad);
        stroke-width: 2;
        stroke-dasharray: 8 12;
        animation: dash 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Tech Grid Background -->
  <g>
    <!-- Horizontal lines -->
    <line x1="0" y1="50" x2="1200" y2="50" class="grid-lines" />
    <line x1="0" y1="100" x2="1200" y2="100" class="grid-lines" />
    <line x1="0" y1="150" x2="1200" y2="150" class="grid-lines" />
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-lines" />
    <line x1="0" y1="250" x2="1200" y2="250" class="grid-lines" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-lines" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-lines" />

    <!-- Vertical lines -->
    <line x1="150" y1="0" x2="150" y2="400" class="grid-lines" />
    <line x1="300" y1="0" x2="300" y2="400" class="grid-lines" />
    <line x1="450" y1="0" x2="450" y2="400" class="grid-lines" />
    <line x1="600" y1="0" x2="600" y2="400" class="grid-lines" />
    <line x1="750" y1="0" x2="750" y2="400" class="grid-lines" />
    <line x1="900" y1="0" x2="900" y2="400" class="grid-lines" />
    <line x1="1050" y1="0" x2="1050" y2="400" class="grid-lines" />
  </g>

  <!-- Decorative Orbiting Circle -->
  <circle cx="250" cy="200" r="100" fill="none" class="moving-path" />

  <!-- Animated Particles/Nodes -->
  <circle cx="250" cy="200" r="4" class="particle orbit-particle-1" fill="#ec4899" />
  
  <!-- Glowing Lock Emblem -->
  <g class="lock-container">
    <!-- Backglow -->
    <circle cx="250" cy="200" r="70" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-glow" />
    
    <!-- Lock Shackle -->
    <path d="M210 190 v-40 a40 40 0 0 1 80 0 v40" fill="none" stroke="url(#lockGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Lock Body -->
    <rect x="180" y="180" width="140" height="110" rx="20" fill="#131520" stroke="url(#lockGrad)" stroke-width="6" />
    
    <!-- Keyhole -->
    <circle cx="250" cy="225" r="12" fill="url(#bgGrad)" />
    <path d="M245 235 l-8 25 h26 l-8 -25 z" fill="url(#bgGrad)" />
  </g>

  <!-- Header Text -->
  <g transform="translate(480, 180)">
    <!-- Title -->
    <text x="0" y="20" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="2">AWESOME ACCESS</text>
    <text x="0" y="75" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1">MANAGEMENT</text>
    
    <!-- Subtitle -->
    <text x="0" y="125" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="url(#subGrad)" letter-spacing="0.5">A curated directory of Identity &amp; Access Control platforms</text>

    <!-- Decorative Tech Info Lines -->
    <line x1="0" y1="150" x2="350" y2="150" stroke="url(#textGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <rect x="0" y="160" width="10" height="10" fill="#38bdf8" />
    <rect x="20" y="160" width="10" height="10" fill="#a855f7" />
    <rect x="40" y="160" width="10" height="10" fill="#ec4899" />
  </g>

  <!-- Decorative Top/Bottom Borders -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#textGrad)" />
  <rect x="0" y="394" width="1200" height="6" fill="url(#textGrad)" />
</svg>
